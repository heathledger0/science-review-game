<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>지식의 탑 · 서바이벌</title>
<style>
@font-face{font-family:'Galmuri';src:url('assets/v2/font/Galmuri11-Bold.woff2') format('woff2');font-display:swap;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{margin:0;height:100%;background:#120f22;color:#eee;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;}
.g{font-family:'Galmuri',sans-serif;}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;}
.scr{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:#1b1830ee;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));}
.scr[hidden]{display:none;}
h1{margin:0 0 6px;font-size:24px;color:#ffd54a;}
.row{display:flex;gap:12px;flex:1;min-height:0;}
.col{flex:1;min-width:0;background:#262345;border:2px solid #45407a;border-radius:12px;padding:10px;overflow:auto;}
.col b.t{display:block;color:#ffd54a;margin-bottom:6px;font-size:15px;}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.gtabs button,.ubtn,.hbtn{background:#3a365a;color:#fff;border:2px solid transparent;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700;}
.gtabs button.on{background:#ffd54a;color:#222;}
.ubtn{display:block;width:100%;text-align:left;margin-bottom:6px;}
.ubtn.on,.hbtn.on{border-color:#ffd54a;background:#3a3523;}
.hgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.hbtn{display:flex;flex-direction:column;align-items:center;padding:6px 2px;font-size:12px;}
.hbtn img{height:56px;image-rendering:pixelated;}
.hinfo{margin-top:8px;font-size:13px;color:#ccc;line-height:1.5;}
.hinfo em{color:#ffd54a;font-style:normal;font-weight:700;}
.go{margin-top:8px;width:100%;padding:12px;border:0;border-radius:12px;background:#ffd54a;color:#222;font-size:22px;}
/* 전투 HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:3;pointer-events:none;padding:calc(4px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));}
#hud[hidden]{display:none;}
.xpbar{height:12px;background:#0008;border:2px solid #000;border-radius:7px;overflow:hidden;}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#53d8fb,#7dff9a);}
.hrow{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:15px;text-shadow:0 1px 2px #000,0 0 3px #000;}
.hrow .sp{flex:1;}
.hpbar{width:130px;height:12px;background:#0008;border:2px solid #000;border-radius:7px;overflow:hidden;}
.hpbar i{display:block;height:100%;width:100%;background:#ff5a6e;}
#timer{font-size:20px;color:#fff;}
#ult{position:fixed;z-index:3;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;border:4px solid #000;background:#2a2748 center/80% no-repeat;box-shadow:0 0 0 3px #ffd54a55;}
#ult[hidden]{display:none;}
#ult .ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#ffd54a var(--p,0%),#0000 0);mask:radial-gradient(circle,#0000 58%,#000 60%);-webkit-mask:radial-gradient(circle,#0000 58%,#000 60%);}
#ult.ready{box-shadow:0 0 18px 6px #ffd54a;animation:pulse 0.8s infinite alternate;}
#ult .lab{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;text-shadow:0 1px 2px #000;}
@keyframes pulse{to{transform:scale(1.06);}}
#pauseBtn{position:fixed;z-index:3;left:calc(10px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));background:#0007;color:#fff;border:2px solid #fff4;border-radius:10px;padding:6px 10px;font-size:13px;}
#pauseBtn[hidden]{display:none;}
/* 문제·카드 */
#ov{position:fixed;inset:0;z-index:6;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;}
#ov[hidden]{display:none;}
.panel{background:#262345;border:3px solid #ffd54a;border-radius:16px;padding:14px 16px;width:min(760px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 40px #000;}
.panel .tag{color:#ffd54a;font-size:15px;margin-bottom:4px;}
.panel .q{font-size:19px;line-height:1.45;margin:4px 0 12px;font-weight:700;}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chs button{background:#3a365a;color:#fff;border:2px solid #5a5490;border-radius:12px;padding:12px 10px;font-size:17px;font-weight:700;min-height:52px;}
.chs button.ok{background:#2f7a4b;border-color:#7dff9a;}
.chs button.no{background:#7a2f3b;border-color:#ff6b81;}
.msg{margin-top:10px;font-size:16px;min-height:22px;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
.card{background:#1d1a36;border:3px solid #5a5490;border-radius:14px;padding:10px 8px;text-align:center;color:#fff;font-size:13px;line-height:1.45;}
.card .ic{font-size:30px;}
.card b{display:block;font-size:16px;margin:4px 0;color:#ffd54a;}
.card .lv{color:#7dff9a;font-size:12px;}
.card.new{border-color:#53d8fb;}
.ct{display:inline-block;margin-right:4px;padding:0 5px;border-radius:5px;font-size:11px;color:#111;}.ct.p{background:#ff9a6b;}.ct.m{background:#b89bff;}
.card:active{transform:scale(.97);}
.btn{display:block;margin:12px auto 0;background:#ffd54a;color:#222;border:0;border-radius:12px;padding:10px 26px;font-size:18px;font-weight:800;}
.res{font-size:16px;line-height:1.9;}
.res b{color:#ffd54a;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="scr" id="scrStart">
  <h1 class="g">지식의 탑 · 서바이벌 (시제품)</h1>
  <div class="row">
    <div class="col"><b class="t g">단원</b><div class="gtabs" id="gtabs"></div><div id="ulist"></div></div>
    <div class="col"><b class="t g">영웅</b><div class="hgrid" id="hgrid"></div><div class="hinfo" id="hinfo"></div>
      <button class="go g" id="goBtn">출전!</button></div>
  </div>
</div>

<div id="hud" hidden>
  <div class="xpbar"><i id="xpf"></i></div>
  <div class="hrow"><span class="g" id="lvl">Lv 1</span><div class="hpbar"><i id="hpf"></i></div><span id="hpt"></span><span class="sp"></span><span id="kills">처치 0</span><span class="g" id="timer">0:00</span></div>
</div>
<button id="ult" hidden><div class="ring"></div><span class="lab" id="ultLab"></span></button>
<button id="pauseBtn" hidden>⏸ 멈춤</button>
<div id="ov" hidden><div class="panel" id="pan"></div></div>

function makeFloor(dom){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); const cols=DOM_COL[dom]||DOM_COL.mix;
  x.fillStyle=cols[0]; x.fillRect(0,0,128,128); let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<260;i++){ x.fillStyle=cols[1+(rnd()*2|0)]; const s=2+(rnd()*3|0); x.fillRect(rnd()*128|0,rnd()*128|0,s,s); }
  for(let i=0;i<10;i++){ x.fillStyle='#ffffff14'; x.fillRect(rnd()*128|0,rnd()*128|0,2,2); }

function moveDir(){ let dx=0,dy=0;
  if(joy.on){ dx=joy.x-joy.ox; dy=joy.y-joy.oy; const m=Math.hypot(dx,dy); const R=50; if(m<6) return [0,0]; const k=Math.min(1,m/R)/m; return [dx*k,dy*k]; }

// ---------- 갱신 ----------
function gainXP(v){ G.xp+=v; while(G.xp>=G.next){ G.xp-=G.next; G.lv++; G.next=Math.round(7+(G.lv-1)*4.5); G.pendingLv=(G.pendingLv||0)+1; } }
function update(dt){
  G.t+=dt; const p=G.p;
  if(G.ultT>0){ G.ultT-=dt; if(G.ultT<=0) G.ultKind=null; }
  // 이동
  const [mx,my]=moveDir(); const spd=p.spd*(1+0.12*plv('speed'));
  p.x=clamp(p.x+mx*spd*dt,p.r,WORLD.w-p.r); p.y=clamp(p.y+my*spd*dt,p.r,WORLD.h-p.r); if(mx) p.face=mx>0?1:-1; p.moving=!!(mx||my); p.mx=mx; if(p.moving){ p.lmx=mx; p.lmy=my; }
  if(p.atkT>0) p.atkT-=dt; if(p.hurtT>0) p.hurtT-=dt;
  if(p.moving){ p.dustT=(p.dustT||0)-dt; if(p.dustT<=0){ p.dustT=0.18; G.fx.push({t:'dust',x:p.x-mx*6,y:p.y+2,life:0.4,l0:0.4}); } }
  if(plv('regen')) p.hp=Math.min(p.max,p.hp+0.6*plv('regen')*dt);
  if(p.inv>0) p.inv-=dt;
  spawnLogic(dt); weapUpdate(dt);
  // 투사체
  for(const b of G.pj){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    for(const e of G.en){ if(e.hp<=0||b.hitSet.has(e)) continue; if((e.x-b.x)**2+(e.y-b.y)**2<=(e.r+b.r)**2){
      b.hitSet.add(e);
      if(b.t==='fire'){ G.fx.push({t:'boom',x:b.x,y:b.y,r:4,max:b.aoe,life:0.3,l0:0.3}); for(const o of G.en) if((o.x-b.x)**2+(o.y-b.y)**2<=(b.aoe+o.r)**2) hitE(o,b.dmg); b.life=0; break; }
      hitE(e,b.dmg); if(--b.pierce<=0){ b.life=0; break; } } } }
  G.pj=G.pj.filter(b=>b.life>0);
  // 적
  const slowAll = G.ultKind==='trap'&&G.ultT>0;
  for(const e of G.en){ if(e.hp<=0) continue; const d=Math.hypot(p.x-e.x,p.y-e.y)||1;
    let s=e.spd*(e.slowT>0?0.5:1)*(slowAll?0.08:1); if(e.slowT>0) e.slowT-=dt; if(e.orbT>0) e.orbT-=dt; if(e.hitT>0) e.hitT-=dt;
    if(e.boss && bossAI(e,dt)) s=0;
    e.x+=(p.x-e.x)/d*s*dt+e.kbx*dt; e.y+=(p.y-e.y)/d*s*dt+e.kby*dt; e.kbx*=Math.pow(0.02,dt); e.kby*=Math.pow(0.02,dt);
    if(d<e.r+p.r && p.inv<=0){ hurtP(e.st==='dash'?Math.round(e.dmg*1.5):e.dmg); } }
  // 보스 탄환·장판
  for(const b of G.eb){ b.x+=b.vx*dt*(slowAll?0.15:1); b.y+=b.vy*dt*(slowAll?0.15:1); b.life-=dt; if((b.x-p.x)**2+(b.y-p.y+12)**2<(b.r+p.r)**2 && p.inv<=0){ hurtP(b.dmg); b.life=0; } }
  G.eb=G.eb.filter(b=>b.life>0);
  for(const w of G.warn){ w.t-=dt; if(w.t<=0){ G.fx.push({t:'pulse',x:w.x,y:w.y,r:10,max:w.r,life:0.3,l0:0.3,c:'#ff5a6e'}); G.shake=Math.max(G.shake,5); if(Math.hypot(p.x-w.x,p.y-w.y)<w.r && p.inv<=0) hurtP(w.dmg); } }
  G.warn=G.warn.filter(w=>w.t>0);
  // 적끼리 살짝 밀어내기(겹침 방지, 근처만)
  for(let i=0;i<G.en.length;i++){ const a=G.en[i]; for(let j=i+1;j<Math.min(G.en.length,i+12);j++){ const b=G.en[j]; const dx=b.x-a.x, dy=b.y-a.y, r=a.r+b.r, d2=dx*dx+dy*dy; if(d2<r*r&&d2>0.01){ const d=Math.sqrt(d2), k=(r-d)/d*0.5; if(!a.boss){a.x-=dx*k*0.5;a.y-=dy*k*0.5;} if(!b.boss){b.x+=dx*k*0.5;b.y+=dy*k*0.5;} } } }
  G.en=G.en.filter(e=>e.hp>0);
  // 경험치 보석
  const mag=plv('magnet') ? 30+28*plv('magnet') : 0;
  for(const g of G.gems){ const d=Math.hypot(p.x-g.x,p.y-g.y); if((mag && d<mag)||g.pull){ g.pull=true; const s=Math.max(180,320-d); g.x+=(p.x-g.x)/(d||1)*s*dt; g.y+=(p.y-g.y)/(d||1)*s*dt; } if(d<p.r+19){ g.got=true; gainXP(g.v); } }
  G.gems=G.gems.filter(g=>!g.got);
  // 보물상자
  for(const c of G.chests){ if(Math.hypot(p.x-c.x,p.y-c.y)<p.r+16){ c.got=true; sfx('gacha_pull'); G.pendingChest=(G.pendingChest||0)+1; } }
  G.chests=G.chests.filter(c=>!c.got);
  // 효과
  for(const f of G.fx){ f.life-=dt; if(f.t==='spark'){ f.x+=f.vx*dt; f.y+=f.vy*dt; } }
  G.fx=G.fx.filter(f=>f.life>0);
  for(const f of G.floats){ f.t-=dt; f.y-=22*dt; } G.floats=G.floats.filter(f=>f.t>0);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
  if(bannerT>0) bannerT-=dt;
  // 종료·레벨업
  if(p.hp<=0){ p.hp=0; end(false); return; }
  if(G.t>=TOTAL+60 && G.boss && G.boss.hp>0 && !G.enraged){ G.enraged=true; G.boss.spd*=1.6; banner('보스가 화났어요! 빨리 쓰러뜨려요!'); }
  if(!G.pause && G.pendingChest>0){ G.pendingChest--; ask('chest'); }
  else if(!G.pause && G.pendingLv>0){ G.pendingLv--; ask('lv'); }
}

function spr(key,x,y,h,flip,alpha,rot,sx,sy){ const im=img(key); if(!im.complete||!im.width) return false; const w=im.width*h/im.height; ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot); ctx.scale((flip?-1:1)*(sx||1),sy||1); if(alpha!=null) ctx.globalAlpha=alpha; ctx.drawImage(im,-w/2,-h,w,h); ctx.restore(); return true; }

    const ph=(e.ph||(e.ph=Math.random()*6)), wob=Math.sin(G.t*9+ph), bob=Math.abs(Math.sin(G.t*9+ph))*(e.boss?1.5:2.2);

    if(e.boss){ const w=e.r*2.4; ctx.fillStyle='#000a'; ctx.fillRect(e.x-w/2,e.y-e.h-6,w,5); ctx.fillStyle=e.k==='boss'?'#ff5a6e':'#c48bff'; ctx.fillRect(e.x-w/2,e.y-e.h-6,w*Math.max(0,e.hp/e.max),5); } }
  // 영웅
  if(G.ultKind==='shield'&&G.ultT>0){ ctx.strokeStyle=`rgba(255,213,74,${0.5+0.3*Math.sin(G.t*10)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p.x,p.y-14,26,0,7); ctx.stroke(); }
  if(G.ultKind==='haste'&&G.ultT>0){ ctx.strokeStyle='#c9b6ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y-14,22+Math.sin(G.t*8)*3,0,7); ctx.stroke(); }
  for(const b of G.eb){ const g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r*1.8); g.addColorStop(0,'#fff'); g.addColorStop(0.4,'#ff5af0'); g.addColorStop(1,'rgba(160,40,255,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*1.8,0,7); ctx.fill(); }
  ctx.fillStyle='#0005'; ctx.beginPath(); ctx.ellipse(p.x,p.y+2,10,4,0,0,7); ctx.fill();
  { const wk=p.moving?G.t*13:0, step=Math.sin(wk), bounce=p.moving?Math.abs(step)*3.2:0, breath=p.moving?0:Math.sin(G.t*3)*0.025;
    const lean=p.moving?(p.mx||0)*0.12:0, atk=(p.atkT>0?p.atkT/0.12:0);
    const sxh=1+breath+(p.moving?0.05*Math.abs(step):0)+atk*0.08, syh=1-breath*0.6-(p.moving?0.06*Math.abs(step):0)-atk*0.05;
    const blink=p.inv>0&&!(G.ultKind==='shield')&&Math.floor(G.t*20)%2;
    spr('hero_'+G.h.img,p.x,p.y+3-bounce,38,p.face<0,blink?0.45:1,lean,sxh,syh);
    if(p.hurtT>0){ const tc=tinted('hero_'+G.h.img,'#ff4d5e'); if(tc){ const w=tc.width*38/tc.height; ctx.save(); ctx.globalAlpha=p.hurtT/0.25*0.7; ctx.translate(p.x,p.y+3-bounce); ctx.rotate(lean); ctx.scale((p.face<0?-1:1)*sxh,syh); ctx.drawImage(tc,-w/2,-38,w,38); ctx.restore(); } }
    if(atk>0){ ctx.fillStyle=`rgba(255,240,180,${atk*0.8})`; ctx.beginPath(); ctx.arc(p.x+p.face*12,p.y-18,4+atk*4,0,7); ctx.fill(); } }
  // 회전 방패
  const ow=G.weap.find(w=>w.id==='orbit'); if(ow){ const L=ow.lv,n=2+(L>=3)+(L>=5)+(plv('sharp')>=2),R=48+3*L; for(let i=0;i<n;i++){ const a=ow.ang+i*Math.PI*2/n, x=p.x+Math.cos(a)*R, y=p.y-10+Math.sin(a)*R;
    ctx.fillStyle='#f2c14e'; ctx.strokeStyle='#5a3b00'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x+8,y-5); ctx.lineTo(x+6,y+5); ctx.lineTo(x,y+9); ctx.lineTo(x-6,y+5); ctx.lineTo(x-8,y-5); ctx.closePath(); ctx.fill(); ctx.stroke(); } }
  // 투사체
  for(const b of G.pj){ if(b.t==='fire'){ ctx.fillStyle='#ff9a3d'; ctx.beginPath(); ctx.arc(b.x,b.y-10,6,0,7); ctx.fill(); ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(b.x,b.y-10,3,0,7); ctx.fill(); }
    else { ctx.save(); ctx.translate(b.x,b.y-10); ctx.rotate(b.ang); if(b.t==='arrow'){ ctx.fillStyle='#e8d9b0'; ctx.fillRect(-9,-1,16,2); ctx.fillStyle='#7ee081'; ctx.fillRect(5,-3,5,6); } else { ctx.fillStyle='#53d8fb'; ctx.fillRect(-14,-1.5,22,3); ctx.fillStyle='#fff'; ctx.fillRect(4,-1.5,6,3); } ctx.restore(); } }
  // 효과
  for(const f of G.fx){ const k=f.life/f.l0;
    if(f.t==='boom'){ ctx.strokeStyle=`rgba(255,154,61,${k})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x,f.y-8,f.max*(1-k)+f.r,0,7); ctx.stroke(); ctx.fillStyle=`rgba(255,224,102,${k*0.35})`; ctx.fill(); }
    else if(f.t==='pulse'){ ctx.strokeStyle=f.c?`rgba(255,213,74,${k})`:`rgba(201,182,255,${k})`; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(f.x,f.y-10,f.r+(f.max-f.r)*(1-k),0,7); ctx.stroke(); }
    else if(f.t==='dust'){ ctx.fillStyle=`rgba(230,220,200,${k*0.45})`; ctx.beginPath(); ctx.arc(f.x,f.y,3+5*(1-k),0,7); ctx.fill(); }
    else if(f.t==='spark'){ ctx.globalAlpha=k; ctx.fillStyle=f.c; ctx.fillRect(f.x-1.5,f.y-10,3,3); ctx.globalAlpha=1; }
    else if(f.t==='meteor'){ ctx.fillStyle=`rgba(255,120,40,${k})`; ctx.beginPath(); ctx.arc(f.x,f.y-10,22*(1.2-k),0,7); ctx.fill(); ctx.strokeStyle=`rgba(255,224,102,${k})`; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(f.x+40*k,f.y-10-120*k); ctx.lineTo(f.x,f.y-10); ctx.stroke(); }
    else if(f.t==='bolt'){ ctx.strokeStyle=`rgba(180,220,255,${k})`; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(f.x1,f.y1); const n=5; for(let i=1;i<n;i++){ const t=i/n; ctx.lineTo(f.x1+(f.x2-f.x1)*t+(Math.random()-0.5)*10, f.y1+(f.y2-f.y1)*t+(Math.random()-0.5)*10); } ctx.lineTo(f.x2,f.y2); ctx.stroke(); ctx.strokeStyle=`rgba(255,255,255,${k})`; ctx.lineWidth=1; ctx.stroke(); }
    else if(f.t==='beam'){ ctx.strokeStyle=`rgba(255,240,160,${k})`; ctx.lineWidth=5*k+1; ctx.beginPath(); ctx.moveTo(f.x1,f.y1-12); ctx.lineTo(f.x2,f.y2-12); ctx.stroke(); } }
  // 글자
  ctx.textAlign='center'; for(const f of G.floats){ ctx.globalAlpha=Math.min(1,f.t/f.t0*2); ctx.font=`bold ${f.size}px sans-serif`; ctx.lineWidth=3; ctx.strokeStyle='#000'; ctx.strokeText(f.txt,f.x,f.y); ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,f.y); } ctx.globalAlpha=1;
  // 화면 좌표: 조이스틱·배너·화살표
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(joy.on){ ctx.globalAlpha=0.5; ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(joy.ox,joy.oy,50,0,7); ctx.stroke(); let dx=joy.x-joy.ox, dy=joy.y-joy.oy; const m=Math.hypot(dx,dy); if(m>50){dx*=50/m;dy*=50/m;} ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(joy.ox+dx,joy.oy+dy,20,0,7); ctx.fill(); ctx.globalAlpha=1; }
  // 화면 밖 보스·상자 방향 표시
  const marks=[...G.chests.map(c=>[c.x,c.y,'#ffd54a']),...G.en.filter(e=>e.boss).map(e=>[e.x,e.y,e.k==='boss'?'#ff5a6e':'#c48bff'])];
  for(const [x,y,c] of marks){ const vx=(x-camX)*Z, vy=(y-camY)*Z; if(vx>0&&vx<W&&vy>0&&vy<H) continue; const cx=W/2,cy=H/2,a=Math.atan2(vy-cy,vx-cx); const ex=clamp(cx+Math.cos(a)*W,26,W-26), ey=clamp(cy+Math.sin(a)*H,60,H-30);
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(a); ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-8,-9); ctx.lineTo(-8,9); ctx.closePath(); ctx.fill(); ctx.restore(); }
  if(bannerT>0){ ctx.globalAlpha=Math.min(1,bannerT); ctx.font="bold 20px 'Galmuri',sans-serif"; ctx.textAlign='center'; ctx.lineWidth=5; ctx.strokeStyle='#000'; ctx.strokeText(bannerTxt,W/2,H*0.3); ctx.fillStyle='#ffd54a'; ctx.fillText(bannerTxt,W/2,H*0.3); ctx.globalAlpha=1; }
}
function hud(){ const p=G.p; $('xpf').style.width=(G.xp/G.next*100)+'%'; $('lvl').textContent='Lv '+G.lv; $('hpf').style.width=(p.hp/p.max*100)+'%'; $('hpt').textContent=Math.ceil(p.hp)+'/'+p.max;
  $('kills').textContent='처치 '+G.kills+' · 정답 '+G.correct+'/'+G.answered;
  const r=Math.max(0,BOSS_T-G.t); $('timer').textContent=G.bossOn?'보스전!':`보스까지 ${Math.floor(r/60)}:${String(Math.floor(r%60)).padStart(2,'0')}`;
  $('ult').style.setProperty('--p',G.gauge+'%'); $('ult').classList.toggle('ready',G.gauge>=100); }

// ---------- 끝 ----------
function end(win,quit){ if(G.over) return; G.over=true; G.pause=true; sfx(win?'clear':'gameover');
  const acc=G.answered?Math.round(G.correct/G.answered*100):0; const tm=Math.floor(G.t);
  $('ov').hidden=false; $('pan').innerHTML=`<div class="tag g" style="font-size:22px;color:${win?'#7dff9a':'#ff6b81'}">${win?'승리! 단원 보스를 물리쳤어요':(quit?'그만했어요':'쓰러졌어요…')}</div>
   <div class="res">버틴 시간 <b>${Math.floor(tm/60)}분 ${tm%60}초</b> · 레벨 <b>${G.lv}</b> · 처치 <b>${G.kills}</b><br>문제 <b>${G.correct}/${G.answered}</b> (정답률 ${acc}%)<br>무기: ${G.weap.map(w=>WEAP[w.id].ic+WEAP[w.id].n+' Lv'+w.lv).join(' · ')}</div>
   <button class="btn g" id="again">다시 하기</button><button class="btn" style="background:#3a365a;color:#fff" id="home">단원·영웅 바꾸기</button>`;
  $('again').onclick=()=>{ $('ov').hidden=true; start(UNITS.indexOf(G.u),HEROES.indexOf(G.h)); };
  $('home').onclick=()=>{ $('ov').hidden=true; G=null; $('hud').hidden=true; $('ult').hidden=true; $('pauseBtn').hidden=true; $('scrStart').hidden=false; drawStart(); };
}

// ---------- 루프 ----------
const clk={t:performance.now()};
function loop(now){ let dt=Math.min(0.05,(now-clk.t)/1000)*(window.__WARP||1); clk.t=now;
  if(G && !G.pause && !G.over){ update(dt); }
  draw(); if(G) hud(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
if(navigator.webdriver) window.__G=()=>G;
})();
</script>
